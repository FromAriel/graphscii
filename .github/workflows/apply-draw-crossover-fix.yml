name: Apply GraphSCII Draw Crossover Fix

on:
  push:
    branches: [resolve-draw-crossovers]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: resolve-draw-crossovers
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build exact crossover runtime
        run: node geometric-glyph-lab/scripts/apply-draw-crossover-fix.mjs

      - name: Validate generated runtime
        run: |
          node --check graphscii-demo/draw-v7.js
          node --check graphscii-demo/debug-export-v3.js
          node -e "const fs=require('node:fs'); require('./graphscii-demo/draw-v7.js'); GraphSCIIDrawV7.selfTest(); const i=JSON.parse(fs.readFileSync('artifacts/manifest/vocabulary-v1/indexes/by-bitmap.json','utf8')); GraphSCIIDrawV7.installBitmapIndex(i.entries); GraphSCIIDrawV7.connectorSelfTest();"

      - name: Commit exact crossover resolver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A graphscii-demo .github/workflows/verify-graphscii-draw.yml
          git diff --cached --exit-code && { echo "Expected crossover patch produced no changes"; exit 1; } || true
          git commit -m "Resolve exact GraphSCII crossover glyphs"
          git push origin HEAD:resolve-draw-crossovers
