name: Apply GraphSCII Font Metrics Fix

on:
  push:
    branches:
      - replace-draw-plan-node-graph
    paths:
      - "geometric-glyph-lab/scripts/apply-font-hmtx-fix.mjs"
      - ".github/workflows/apply-font-hmtx-fix.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replace-draw-plan-node-graph
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch font compiler
        run: node geometric-glyph-lab/scripts/apply-font-hmtx-fix.mjs

      - name: Regenerate GraphSCII font
        working-directory: geometric-glyph-lab
        run: npm run generate:font

      - name: Verify regenerated font
        working-directory: geometric-glyph-lab
        run: npm run verify:font

      - name: Show changed artifacts
        run: git status --short

      - name: Commit repaired compiler and font
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geometric-glyph-lab/scripts/font-compiler.mjs artifacts/fonts/GraphSCII-Regular.ttf artifacts/fonts/manifest.json
          git diff --cached --exit-code && { echo "Expected font repair produced no changes"; exit 1; } || true
          git commit -m "Fix GraphSCII TrueType glyph side bearings"
          git push origin HEAD:replace-draw-plan-node-graph
