name: Verify Milestone 5E graphics-v1 publication

on:
  push:
    branches:
      - milestone-5e-graphics-v1-publication
  pull_request:
    branches:
      - milestone-5-junction-coverage-plan

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-5e-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: milestone-5e-graphics-v1-publication
          fetch-depth: 0

      - name: Correct connector semantics envelope if needed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('geometric-glyph-lab/scripts/vocabulary-publication-v1.mjs')
          s = p.read_text()
          pattern = re.compile(
              r'  if \(!Array\.isArray\(semantics\) \|\| semantics\.length !== EXPECTED_CONNECTOR_SEMANTICS\) \{\n'
              r'    throw new Error\(`Milestone 5E requires \$\{EXPECTED_CONNECTOR_SEMANTICS\} connector semantics\.`\);\n'
              r'  \}\n'
          )
          replacement = '''  if (
            semantics?.schema !== "graphscii-generic-connector-semantics-v1" ||
            semantics?.semanticCount !== EXPECTED_CONNECTOR_SEMANTICS ||
            !Array.isArray(semantics.semantics) ||
            semantics.semantics.length !== EXPECTED_CONNECTOR_SEMANTICS
          ) {
            throw new Error(`Milestone 5E requires ${EXPECTED_CONNECTOR_SEMANTICS} connector semantics.`);
          }
          '''
          s2, count = pattern.subn(replacement, s)
          if count == 1:
              p.write_text(s2)
          elif 'semantics?.semanticCount !== EXPECTED_CONNECTOR_SEMANTICS' not in s:
              raise SystemExit(f'Expected exactly one semantics fixture replacement, found {count}.')
          PY

      - name: Persist source correction
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- geometric-glyph-lab/scripts/vocabulary-publication-v1.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Fix graphics-v1 connector semantics fixture"
            git push origin HEAD:milestone-5e-graphics-v1-publication
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geometric-glyph-lab
        run: npm install

      - name: Typecheck
        working-directory: geometric-glyph-lab
        run: npm run check

      - name: Generate complete project
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify complete project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Print graphics-v1 publication
        run: cat artifacts/publications/graphscii-graphics-v1.json

      - name: Commit deterministic publication outputs
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            artifacts/publications/graphscii-graphics-v1.json \
            artifacts/publications/graphscii-graphics-v1.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish GraphSCII graphics vocabulary v1"
            git push origin HEAD:milestone-5e-graphics-v1-publication
          else
            echo "graphics-v1 publication already matches."
          fi
