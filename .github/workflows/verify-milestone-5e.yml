name: Verify Milestone 5E graphics-v1 publication

on:
  push:
    branches:
      - milestone-5e-graphics-v1-publication
  pull_request:
    branches:
      - milestone-5-junction-coverage-plan

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-5e-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: milestone-5e-graphics-v1-publication
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geometric-glyph-lab
        run: npm install

      - name: Typecheck
        working-directory: geometric-glyph-lab
        run: npm run check

      - name: Generate complete project
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify complete project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Print graphics-v1 publication
        run: cat artifacts/publications/graphscii-graphics-v1.json

      - name: Commit deterministic publication outputs
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            artifacts/publications/graphscii-graphics-v1.json \
            artifacts/publications/graphscii-graphics-v1.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish GraphSCII graphics vocabulary v1"
            git push origin HEAD:milestone-5e-graphics-v1-publication
          else
            echo "graphics-v1 publication already matches."
          fi
