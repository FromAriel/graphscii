name: Build Milestone 4A.1 fill registry

on:
  push:
    branches:
      - milestone-4a1-fill-registry
    paths:
      - .github/workflows/build-milestone-4a1.yml
      - geometric-glyph-lab/package.json
      - geometric-glyph-lab/scripts/fill-registry.mjs
      - geometric-glyph-lab/scripts/generate-fill-registry.mjs
      - geometric-glyph-lab/scripts/verify-fill-registry.mjs

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-4a1
  cancel-in-progress: false

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: milestone-4a1-fill-registry
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate all current artifacts including fill registry
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify all current artifacts including fill registry
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Commit generated fill registry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- artifacts/manifest/fills
          if git diff --cached --quiet; then
            echo "Fill registry already matches deterministic generation."
            exit 0
          fi
          git commit -m "Generate Milestone 4A.1 fill registry"
          git push origin HEAD:milestone-4a1-fill-registry
