name: Verify Milestone 9A GraphSCII font

on:
  pull_request:
    branches:
      - milestone-5-junction-coverage-plan

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-9a-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-font:
    runs-on: ubuntu-latest
    steps:
      - name: Check out font compiler branch
        uses: actions/checkout@v4
        with:
          ref: milestone-9-font-compiler-standard
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geometric-glyph-lab
        run: npm install

      - name: Typecheck application
        working-directory: geometric-glyph-lab
        run: npm run check

      - name: Generate reference GraphSCII font
        working-directory: geometric-glyph-lab
        run: npm run generate:font

      - name: Verify every generated font glyph
        working-directory: geometric-glyph-lab
        run: npm run verify:font

      - name: Run complete deterministic generation chain
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Run complete verification chain
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Reject unexpected generated changes
        shell: bash
        run: |
          rm -rf geometric-glyph-lab/node_modules geometric-glyph-lab/package-lock.json
          python - <<'PY'
          import subprocess
          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          unexpected = []
          for line in lines:
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if not path.startswith('artifacts/fonts/'):
                  unexpected.append(line)
          if unexpected:
              raise SystemExit('Unexpected generated changes after full verification:\n' + '\n'.join(unexpected))
          print('Only deterministic font outputs changed.')
          PY

      - name: Freeze Milestone 9A completion state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          manifest = json.loads(Path('artifacts/fonts/manifest.json').read_text())
          digest = manifest['fontSha256']

          doc = Path('docs/milestone-9a-font-compiler.md')
          text = doc.read_text()
          text = text.replace(
              'Status: **IN IMPLEMENTATION — CI PUBLICATION GATE NEXT**',
              'Status: **COMPLETE — FULL-CHAIN VERIFIED REFERENCE TTF**'
          )
          text += f'''\n\n## Frozen verified result\n\n```text\nfont                            artifacts/fonts/GraphSCII-Regular.ttf\nfont SHA-256                     {digest}\nsource registry SHA-256          {manifest['sourceRegistrySha256']}\nencoded characters               {manifest['encodedCharacters']:,}\nsfnt glyphs                      {manifest['sfntGlyphs']:,}\nunits per em                     {manifest['unitsPerEm']:,}\nadvance width                    {manifest['advanceWidth']:,}\nall-glyph raster round-trip      PASS\ndeterministic byte rebuild       PASS\nfull GraphSCII generate/verify    PASS\n```\n\nThe verified font is the first reference implementation of **GraphSCII — Graphical Standard for Computer Information Interchange, by Ariel Williams**.\n'''
          doc.write_text(text)

          plan = Path('PLAN.md')
          p = plan.read_text()
          start = p.index('## 10. Next major implementation direction')
          end = p.index('## 12. Guiding rule', start)
          replacement = f'''## 10. Milestone 9 — reference font compiler — ACTIVE\n\nGraphSCII now has a deterministic reference TrueType compiler that consumes the frozen `graphscii-graphics-v1` registry directly.\n\n### 9A — GraphSCII Regular reference TTF + public standard — COMPLETE\n\n```text\nformal standard name       Graphical Standard for Computer Information Interchange\ndesigner                   Ariel Williams\nfont family                GraphSCII\nfont                       GraphSCII-Regular.ttf\nprintable ASCII            95\nPUA graphics               6,397\nencoded characters         6,492\nsfnt glyphs incl .notdef   6,493\nunits per em               1,024\nadvance width              512\nfont SHA-256               {digest}\n```\n\nMilestone 9A also freezes the public documentation/licensing layer:\n\n```text\nGRAPHSCII-STANDARD.md\nFONT-LICENSE.txt\nCOMMERCIAL-LICENSE.md\nINDIE-LICENSE.md\nTHIRD-PARTY-NOTICES.md\nREADME.md\n```\n\nThe font verifier decodes every generated TrueType glyph back to the canonical 8×16 grid and requires exact bitmap equality. The compiler preserves every v1 PUA assignment and produces deterministic bytes.\n\nCompletion note: [`docs/milestone-9a-font-compiler.md`](docs/milestone-9a-font-compiler.md)\n\n### 9B — external compatibility + distribution package — NEXT\n\nNext, validate the reference TTF with independent font tooling and representative Windows/Linux/browser renderers, produce install/distribution packages, add human-visible specimen sheets, and freeze a release-facing font manifest without changing canonical glyph geometry.\n\n---\n\n## 11. Later milestones\n\n```text\n6   curated curve/arc extension if independently justified    PAUSED\n7   terminals / specials                                      DEFERRED\n8   vocabulary optimization                                   SATISFIED BY v1 freeze\n9A  reference TTF + graphical standard                        COMPLETE\n9B  compatibility/distribution validation                     NEXT\n10  drawing API / solver\n11  interactive editor\n12  GraphSCII v1 font/release freeze\n```\n\n---\n\n'''
          plan.write_text(p[:start] + replacement + p[end:])
          PY

      - name: Commit verified font, roadmap, and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-milestone-9a.yml
          git add -- \
            artifacts/fonts/GraphSCII-Regular.ttf \
            artifacts/fonts/manifest.json \
            docs/milestone-9a-font-compiler.md \
            PLAN.md
          git commit -m "Publish verified GraphSCII reference font"
          git push origin HEAD:milestone-9-font-compiler-standard
