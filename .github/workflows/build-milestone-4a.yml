name: Build Milestone 4A straight fills

on:
  push:
    branches:
      - milestone-4a-straight-solid-fills
    paths:
      - .github/workflows/build-milestone-4a.yml
      - geometric-glyph-lab/index.html
      - geometric-glyph-lab/package.json
      - geometric-glyph-lab/src/core/fill.ts
      - geometric-glyph-lab/src/core/index.ts
      - geometric-glyph-lab/src/fill-lab.ts
      - geometric-glyph-lab/scripts/verify-fills.mjs
      - spec/straight-fill-solid-research.json

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-4a
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: milestone-4a-straight-solid-fills
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        working-directory: geometric-glyph-lab
        run: npm install --no-audit --no-fund

      - name: Type-check and build prebuilt lab
        working-directory: geometric-glyph-lab
        run: npm run build

      - name: Verify solid fill fixture
        working-directory: geometric-glyph-lab
        run: npm run verify:fills

      - name: Commit generated dist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- geometric-glyph-lab/dist
          if git diff --cached --quiet; then
            echo "Prebuilt dist already matches source."
            exit 0
          fi
          git commit -m "Build Milestone 4A prebuilt lab"
          git push origin HEAD:milestone-4a-straight-solid-fills
