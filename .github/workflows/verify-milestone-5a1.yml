name: Verify Milestone 5A.1 junction demand

on:
  push:
    branches:
      - milestone-5-junction-coverage-plan
  pull_request:
    branches:
      - milestone-4d-publication-plan

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-5a1-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-5-junction-coverage-plan
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geometric-glyph-lab
        run: npm install

      - name: Typecheck source
        working-directory: geometric-glyph-lab
        run: npm run check

      - name: Generate deterministic project artifacts
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify complete project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Commit deterministic Milestone 5A.1 outputs on push runs
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- artifacts/research/junctions spec/junction-coverage-research-v0.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate Milestone 5A.1 junction demand artifacts"
            git push origin HEAD:milestone-5-junction-coverage-plan
          else
            echo "Milestone 5A.1 generated outputs already match."
          fi

      - name: Advance Milestone 5 roadmap on push runs
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"Could not update {label}")

          plan = Path("PLAN.md")
          text = plan.read_text()
          old_section = '''## 11. Later milestones

```text
5   junctions / reserve-budget strategy
6   curated curve/arc extension if justified
7   terminals / specials
8   vocabulary optimization
9   font compiler
10  drawing API / solver
11  interactive editor
12  GraphSCII v1 freeze / release
```

The 604-slot reserve is intentionally protected until later families are measured.'''
          new_section = '''## 11. Milestone 5 — junction coverage and reserve-budget strategy — IN PROGRESS

Detailed plan:

[`docs/milestone-5-junction-coverage-plan.md`](docs/milestone-5-junction-coverage-plan.md)

### 5A.1 — straight-composition demand map + coverage taxonomy — COMPLETE

Completion note:

[`docs/milestone-5a1-junction-demand-map.md`](docs/milestone-5a1-junction-demand-map.md)

The allocation-free demand model derives selectable junction rays from the 832 frozen straight mathematical definitions.

Measured result:

```text
theoretical one-port/edge semantics      22,528
observed demanded semantics               22,428
coverage                               99.556108%
weighted demand events                   928,242
exact mathematical hub positions          70,707
unobserved breadth-protection semantics       100
junction codepoints allocated                  0
protected reserve                            604
```

All 6,144 three-port semantics occur naturally in the measured composition language. The 100 zero-demand blind spots are all four-port `LRTB` tuples and remain explicit breadth-protection candidates.

The exact center `(3.5, 7.5)` is the strongest single hub but accounts for only 3.876360% of measured demand, confirming that junction coverage must remain spatially broad rather than center-only.

**NEXT: 5A.2 — deterministic junction raster / hub-model sweep.**

---

## 12. Later milestones

```text
6   curated curve/arc extension if justified
7   terminals / specials
8   vocabulary optimization
9   font compiler
10  drawing API / solver
11  interactive editor
12  GraphSCII v1 freeze / release
```

The 604-slot reserve remains protected. Milestone 5A research allocates no new codepoints.'''
          text = replace_once(text, old_section, new_section, "PLAN Milestone 5 section")
          text = replace_once(text, "## 12. Current commands", "## 13. Current commands", "PLAN commands heading")
          text = replace_once(text, "## 13. Guiding rule", "## 14. Guiding rule", "PLAN guiding-rule heading")
          text = replace_once(
              text,
              "npm run generate:graphics-publication\nnpm run verify:graphics-publication\nnpm run check",
              "npm run generate:graphics-publication\nnpm run verify:graphics-publication\nnpm run generate:junction-demand\nnpm run verify:junction-demand\nnpm run generate:junction-blind-spots\nnpm run verify:junction-blind-spots\nnpm run check",
              "PLAN junction commands",
          )
          text = text.replace(
              "Milestone 5 junction research is next.",
              "Milestone 5A.1 is complete: the allocation-free selectable-ray demand model covers 22,428 of 22,528 theoretical junction semantics and preserves all 604 reserve slots. Milestone 5A.2 hub/raster-model research is next.",
          )
          plan.write_text(text)

          detailed = Path("docs/milestone-5-junction-coverage-plan.md")
          text = detailed.read_text()
          text = replace_once(
              text,
              "Status: **PLANNED — 5A.1 NEXT**",
              "Status: **IN PROGRESS — 5A.1 COMPLETE; 5A.2 NEXT**",
              "detailed Milestone 5 status",
          )
          text = replace_once(
              text,
              "├── coverage-buckets.json\n├── budget-curves.json",
              "├── coverage-buckets.json\n├── blind-spots.json\n├── budget-curves.json",
              "detailed blind-spot output",
          )
          text = replace_once(
              text,
              "5A.1  straight-composition demand map + coverage taxonomy       NEXT\n5A.2  deterministic junction raster/hub model sweep",
              "5A.1  straight-composition demand map + coverage taxonomy       COMPLETE\n5A.2  deterministic junction raster/hub model sweep                  NEXT",
              "detailed execution status",
          )
          text = replace_once(
              text,
              "The immediate next implementation slice is **5A.1**, and it remains allocation-free.",
              "Milestone **5A.1 is COMPLETE** and remained allocation-free. Completion note: [`milestone-5a1-junction-demand-map.md`](milestone-5a1-junction-demand-map.md). The immediate next implementation slice is **5A.2**.",
              "detailed definition-of-done status",
          )
          detailed.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- PLAN.md docs/milestone-5-junction-coverage-plan.md
          if git diff --cached --quiet; then
            echo "Milestone 5A.1 roadmap already complete."
            exit 0
          fi
          git commit -m "Complete Milestone 5A.1 junction demand map"
          git push origin HEAD:milestone-5-junction-coverage-plan
