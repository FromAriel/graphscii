name: Verify Milestone 5C connector allocation

on:
  push:
    branches:
      - milestone-5c-connector-allocation
  pull_request:
    branches:
      - milestone-5-junction-coverage-plan

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-5c-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out allocation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-5c-connector-allocation
          fetch-depth: 0

      - name: Fix diagonal reuse guard if needed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('geometric-glyph-lab/scripts/connector-allocation.mjs')
          s = p.read_text()
          old = '''    if (!baseByBitmap.has(semantic.bitmapKey) && !orthOwnerByBitmap.get(semantic.bitmapKey)?.novel) {
                throw new Error(`Selected diagonal semantic ${semanticId} has inconsistent reuse metadata.`);
              }
          '''
          new = '''    const reusesBase = baseByBitmap.has(semantic.bitmapKey);
              const reusesOrthogonal = orthOwnerByBitmap.has(semantic.bitmapKey);
              if (sourceOwner.incrementalNovel && (reusesBase || reusesOrthogonal)) {
                throw new Error(`Selected diagonal semantic ${semanticId} is marked novel but reuses an earlier owner.`);
              }
              if (!sourceOwner.incrementalNovel && !reusesBase && !reusesOrthogonal) {
                throw new Error(`Selected diagonal semantic ${semanticId} is marked reuse but has no earlier owner.`);
              }
          '''
          if old in s:
              p.write_text(s.replace(old, new))
          PY

      - name: Persist source correction
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- geometric-glyph-lab/scripts/connector-allocation.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Fix connector allocation reuse guard"
            git push origin HEAD:milestone-5c-connector-allocation
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geometric-glyph-lab
        run: npm install

      - name: Typecheck
        working-directory: geometric-glyph-lab
        run: npm run check

      - name: Generate complete project
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify complete project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Print connector allocation stats
        run: cat artifacts/manifest/vocabulary-v1/stats.json

      - name: Commit deterministic Milestone 5C outputs
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            artifacts/manifest/vocabulary-v1 \
            artifacts/vocabulary/connectors \
            artifacts/vocabulary/atlases/connectors \
            artifacts/vocabulary/atlases/master-layout-map-v1.md \
            spec/generic-connector-allocation-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate Milestone 5C connector allocation artifacts"
            git push origin HEAD:milestone-5c-connector-allocation
          else
            echo "Milestone 5C outputs already match."
          fi
