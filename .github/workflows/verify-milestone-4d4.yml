name: Verify Milestone 4D.4 master atlases

on:
  push:
    branches:
      - milestone-4d-publication-plan

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-4d4
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-4d-publication-plan
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geometric-glyph-lab
        run: npm install

      - name: Typecheck source
        working-directory: geometric-glyph-lab
        run: npm run check

      - name: Generate deterministic project artifacts
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify complete project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Advance Milestone 4D roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"Could not update {label}")

          plan = Path("PLAN.md")
          text = plan.read_text()
          replacements = [
              (
                  "4D.4  master text atlas + page atlas + layout map          NEXT",
                  "4D.4  master text atlas + page atlas + layout map          COMPLETE",
                  "PLAN 4D.4 execution status",
              ),
              (
                  "4D.5  renderer-only resolution registry",
                  "4D.5  renderer-only resolution registry                     NEXT",
                  "PLAN 4D.5 execution status",
              ),
              (
                  "### 4D.4 — master text atlas — REQUIRED PUBLICATION ARTIFACT — NEXT",
                  "### 4D.4 — master text atlas — COMPLETE\n\nCompletion note: [`docs/milestone-4d4-master-atlases.md`](docs/milestone-4d4-master-atlases.md)",
                  "PLAN 4D.4 heading",
              ),
              (
                  "### 4D.5 — renderer-only resolution",
                  "### 4D.5 — renderer-only resolution — NEXT",
                  "PLAN 4D.5 heading",
              ),
              (
                  "npm run generate:vocabulary-atlases\nnpm run verify:vocabulary-atlases\nnpm run check",
                  "npm run generate:vocabulary-atlases\nnpm run verify:vocabulary-atlases\nnpm run generate:vocabulary-master-atlas\nnpm run verify:vocabulary-master-atlas\nnpm run check",
                  "PLAN master atlas commands",
              ),
              (
                  "The published straight allocation remains authoritative. Milestone 4D.1 has provisionally allocated the selected 5,796-owner graphics vocabulary through U+F6A3; Milestone 4D.3 has added deterministic categorized, combined, renderer-only, and reserve-layout atlases on top of the 5,796 canonical owners. The 604-slot U+F6A4..U+F8FF reserve remains untouched. Milestone 4D.4 is next.",
                  "The published straight allocation remains authoritative. Milestone 4D.1 has provisionally allocated the selected 5,796-owner graphics vocabulary through U+F6A3; Milestone 4D.4 has added the deterministic master text atlas, 23-page codepoint atlas, five category text atlases, and master layout map on top of the verified 4D.3 atlas layer. The 604-slot U+F6A4..U+F8FF reserve remains untouched. Milestone 4D.5 is next.",
                  "PLAN current-state paragraph",
              ),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)
          plan.write_text(text)

          detailed = Path("docs/milestone-4d-publication-plan.md")
          text = detailed.read_text()
          replacements = [
              (
                  "Status: **IN PROGRESS — 4D.1, 4D.2, AND 4D.3 COMPLETE; 4D.4 NEXT**",
                  "Status: **IN PROGRESS — 4D.1 THROUGH 4D.4 COMPLETE; 4D.5 NEXT**",
                  "detailed 4D status",
              ),
              (
                  "## 5. Milestone 4D.4 — master text atlas and master layout map — NEXT",
                  "## 5. Milestone 4D.4 — master text atlas and master layout map — COMPLETE\n\nCompletion note: [`milestone-4d4-master-atlases.md`](milestone-4d4-master-atlases.md)",
                  "detailed 4D.4 heading",
              ),
              (
                  "## 6. Milestone 4D.5 — renderer-only resolution registry",
                  "## 6. Milestone 4D.5 — renderer-only resolution registry — NEXT",
                  "detailed 4D.5 heading",
              ),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)
          detailed.write_text(text)
          PY

      - name: Commit Milestone 4D.4 roadmap completion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- PLAN.md docs/milestone-4d-publication-plan.md
          if git diff --cached --quiet; then
            echo "Milestone 4D.4 roadmap already complete."
            exit 0
          fi
          git commit -m "Complete Milestone 4D.4 master atlases"
          git push origin HEAD:milestone-4d-publication-plan
