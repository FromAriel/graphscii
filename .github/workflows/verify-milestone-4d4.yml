name: Verify Milestone 4D.4 master atlases

on:
  push:
    branches:
      - milestone-4d-publication-plan

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-4d4
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-4d-publication-plan
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geometric-glyph-lab
        run: npm install

      - name: Apply permanent 4D.3 atlas ownership boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("geometric-glyph-lab/scripts/vocabulary-atlases.mjs")
          text = path.read_text()

          old_generate = '''export async function generateVocabularyAtlases(repoRoot) {
            const { registry, rendererOnly } = await loadCanonicalInputs(repoRoot);
            const outputRoot = path.join(repoRoot, "artifacts", "vocabulary", "atlases");
            const built = buildAtlasFiles(registry, rendererOnly);
            await rm(outputRoot, { recursive: true, force: true });
            await mkdir(outputRoot, { recursive: true });
            await writeFiles(outputRoot, built.files);
            return built.stats;
          }'''.replace("          ", "")

          new_generate = '''export async function generateVocabularyAtlases(repoRoot) {
            const { registry, rendererOnly } = await loadCanonicalInputs(repoRoot);
            const outputRoot = path.join(repoRoot, "artifacts", "vocabulary", "atlases");
            const built = buildAtlasFiles(registry, rendererOnly);
            await mkdir(outputRoot, { recursive: true });
            const managedDirectories = [
              ...CATEGORY_DEFINITIONS.map((definition) => definition.id),
              "combined",
              "renderer-only",
              "reserve-layout",
            ];
            for (const directory of managedDirectories) {
              await rm(path.join(outputRoot, directory), { recursive: true, force: true });
            }
            await rm(path.join(outputRoot, "stats.json"), { force: true });
            await writeFiles(outputRoot, built.files);
            return built.stats;
          }'''.replace("          ", "")

          old_verify = '''  const expectedNames = [...expected.files.keys()].sort();
            const actualNames = await listFilesRecursive(outputRoot);
            if (JSON.stringify(actualNames) !== JSON.stringify(expectedNames)) {
              throw new Error(`Milestone 4D.3 atlas file list mismatch: expected ${expectedNames.length}, got ${actualNames.length}.`);
            }'''.replace("          ", "")

          new_verify = '''  const expectedNames = [...expected.files.keys()].sort();
            const managedDirectories = new Set([
              ...CATEGORY_DEFINITIONS.map((definition) => definition.id),
              "combined",
              "renderer-only",
              "reserve-layout",
            ]);
            const actualNames = (await listFilesRecursive(outputRoot)).filter((relative) => {
              if (relative === "stats.json") return true;
              const [topLevel] = relative.split("/");
              return managedDirectories.has(topLevel);
            });
            if (JSON.stringify(actualNames) !== JSON.stringify(expectedNames)) {
              throw new Error(`Milestone 4D.3 managed atlas file list mismatch: expected ${expectedNames.length}, got ${actualNames.length}.`);
            }'''.replace("          ", "")

          if old_generate in text:
              text = text.replace(old_generate, new_generate)
          elif new_generate not in text:
              raise SystemExit("Could not locate Milestone 4D.3 generation ownership block")

          if old_verify in text:
              text = text.replace(old_verify, new_verify)
          elif new_verify not in text:
              raise SystemExit("Could not locate Milestone 4D.3 verification ownership block")

          path.write_text(text)
          PY

      - name: Fix master layout emphasis
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("geometric-glyph-lab/scripts/vocabulary-master-atlas.mjs")
          text = path.read_text()
          old = 'unique derived bitmaps.`,\n'
          new = 'unique derived bitmaps**.`,\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Could not locate master layout renderer-only emphasis")
          path.write_text(text)
          PY

      - name: Typecheck source
        working-directory: geometric-glyph-lab
        run: npm run check

      - name: Generate deterministic project artifacts
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify complete project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Commit deterministic Milestone 4D.4 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            geometric-glyph-lab/scripts/vocabulary-atlases.mjs \
            geometric-glyph-lab/scripts/vocabulary-master-atlas.mjs \
            artifacts/vocabulary/atlases/master-text-atlas.md \
            artifacts/vocabulary/atlases/master-text-atlas.txt \
            artifacts/vocabulary/atlases/master-page-atlas.md \
            artifacts/vocabulary/atlases/master-page-atlas.txt \
            artifacts/vocabulary/atlases/master-layout-map.md \
            artifacts/vocabulary/atlases/straight-text-atlas.md \
            artifacts/vocabulary/atlases/solid-text-atlas.md \
            artifacts/vocabulary/atlases/medium-text-atlas.md \
            artifacts/vocabulary/atlases/half-text-atlas.md \
            artifacts/vocabulary/atlases/light-text-atlas.md
          if git diff --cached --quiet; then
            echo "Milestone 4D.4 master outputs already match deterministic generation."
            exit 0
          fi
          git commit -m "Polish Milestone 4D.4 master atlases"
          git push origin HEAD:milestone-4d-publication-plan
