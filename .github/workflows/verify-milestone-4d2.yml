name: Verify Milestone 4D.2 canonical glyph artifacts

on:
  push:
    branches:
      - milestone-4d-publication-plan

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-4d2
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-4d-publication-plan
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geometric-glyph-lab
        run: npm install

      - name: Typecheck source
        working-directory: geometric-glyph-lab
        run: npm run check

      - name: Regenerate deterministic artifacts
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify complete project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Advance roadmap to Milestone 4D.3
        working-directory: geometric-glyph-lab
        run: node scripts/finalize-4d2-docs.mjs

      - name: Commit completed Milestone 4D.2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            artifacts/vocabulary/glyphs \
            PLAN.md \
            docs/milestone-4d-publication-plan.md
          git rm -- \
            .github/workflows/verify-milestone-4d2.yml \
            geometric-glyph-lab/scripts/finalize-4d2-docs.mjs
          git commit -m "Complete Milestone 4D.2 canonical glyph artifacts"
          git push origin HEAD:milestone-4d-publication-plan
