name: Verify Milestone 4D.5 renderer-only resolution

on:
  push:
    branches:
      - milestone-4d-publication-plan

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-4d5
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-4d-publication-plan
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geometric-glyph-lab
        run: npm install

      - name: Typecheck source
        working-directory: geometric-glyph-lab
        run: npm run check

      - name: Generate deterministic project artifacts
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify complete project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Commit deterministic Milestone 4D.5 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- artifacts/vocabulary/renderer-only
          if ! git diff --cached --quiet; then
            git commit -m "Generate Milestone 4D.5 renderer-only resolution artifacts"
            git push origin HEAD:milestone-4d-publication-plan
            exit 0
          fi

      - name: Advance Milestone 4D roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"Could not update {label}")

          plan = Path("PLAN.md")
          text = plan.read_text()
          replacements = [
              (
                  "4D.5  renderer-only resolution registry                     NEXT",
                  "4D.5  renderer-only resolution registry                     COMPLETE",
                  "PLAN 4D.5 execution status",
              ),
              (
                  "4D.6  graphscii-graphics-v0 publication snapshot",
                  "4D.6  graphscii-graphics-v0 publication snapshot              NEXT",
                  "PLAN 4D.6 execution status",
              ),
              (
                  "### 4D.5 — renderer-only resolution — NEXT",
                  "### 4D.5 — renderer-only resolution — COMPLETE\n\nCompletion note: [`docs/milestone-4d5-renderer-only-resolution.md`](docs/milestone-4d5-renderer-only-resolution.md)",
                  "PLAN 4D.5 heading",
              ),
              (
                  "### 4D.6 — publication",
                  "### 4D.6 — publication — NEXT",
                  "PLAN 4D.6 heading",
              ),
              (
                  "npm run generate:vocabulary-master-atlas\nnpm run verify:vocabulary-master-atlas\nnpm run check",
                  "npm run generate:vocabulary-master-atlas\nnpm run verify:vocabulary-master-atlas\nnpm run generate:renderer-only-resolution\nnpm run verify:renderer-only-resolution\nnpm run check",
                  "PLAN renderer-only commands",
              ),
              (
                  "The published straight allocation remains authoritative. Milestone 4D.1 has provisionally allocated the selected 5,796-owner graphics vocabulary through U+F6A3; Milestone 4D.4 has added the deterministic master text atlas, 23-page codepoint atlas, five category text atlases, and master layout map on top of the verified 4D.3 atlas layer. The 604-slot U+F6A4..U+F8FF reserve remains untouched. Milestone 4D.5 is next.",
                  "The published straight allocation remains authoritative. Milestone 4D.5 now persists all 3,392 renderer-only semantic resolutions as dense, sparse, and demoted-half publication artifacts: 414 exact encoded reuses and 2,978 derived aliases across 2,555 unique derived bitmaps, with every demoted-half fallback independently verified at Hamming distance 1. The 604-slot U+F6A4..U+F8FF reserve remains untouched. Milestone 4D.6 publication is next.",
                  "PLAN current-state paragraph",
              ),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)
          plan.write_text(text)

          detailed = Path("docs/milestone-4d-publication-plan.md")
          text = detailed.read_text()
          replacements = [
              (
                  "Status: **IN PROGRESS — 4D.1 THROUGH 4D.4 COMPLETE; 4D.5 NEXT**",
                  "Status: **IN PROGRESS — 4D.1 THROUGH 4D.5 COMPLETE; 4D.6 NEXT**",
                  "detailed 4D status",
              ),
              (
                  "## 6. Milestone 4D.5 — renderer-only resolution registry — NEXT",
                  "## 6. Milestone 4D.5 — renderer-only resolution registry — COMPLETE\n\nCompletion note: [`milestone-4d5-renderer-only-resolution.md`](milestone-4d5-renderer-only-resolution.md)",
                  "detailed 4D.5 heading",
              ),
              (
                  "## 7. Milestone 4D.6 — publication snapshot",
                  "## 7. Milestone 4D.6 — publication snapshot — NEXT",
                  "detailed 4D.6 heading",
              ),
              (
                  "4D.1  canonical allocation registry                 NEXT\n4D.2  5,796 canonical ASCII/PNG artifacts\n4D.3  category atlases\n4D.4  master text atlas + page atlas + layout map\n4D.5  renderer-only resolution registry\n4D.6  graphscii-graphics-v0 publication snapshot",
                  "4D.1  canonical allocation registry                 COMPLETE\n4D.2  5,796 canonical ASCII/PNG artifacts             COMPLETE\n4D.3  category atlases                                COMPLETE\n4D.4  master text atlas + page atlas + layout map      COMPLETE\n4D.5  renderer-only resolution registry               COMPLETE\n4D.6  graphscii-graphics-v0 publication snapshot      NEXT",
                  "detailed implementation order",
              ),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)
          detailed.write_text(text)
          PY

      - name: Commit Milestone 4D.5 roadmap completion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- PLAN.md docs/milestone-4d-publication-plan.md
          if git diff --cached --quiet; then
            echo "Milestone 4D.5 roadmap already complete."
            exit 0
          fi
          git commit -m "Complete Milestone 4D.5 renderer-only resolution registry"
          git push origin HEAD:milestone-4d-publication-plan
