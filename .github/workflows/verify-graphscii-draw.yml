name: Verify GraphSCII Draw

on:
  pull_request:
    paths:
      - "graphscii-demo/**"
      - ".github/workflows/verify-graphscii-draw.yml"
  push:
    branches:
      - main
    paths:
      - "graphscii-demo/**"
      - ".github/workflows/verify-graphscii-draw.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deterministic lookup
        run: node graphscii-demo/verify.mjs

      - name: Check browser runtime syntax
        run: |
          node --check graphscii-demo/draw-v6.js
          node --check graphscii-demo/debug-export-v2.js
          node --check graphscii-demo/crossover-compositor-v1.js

      - name: Verify exact font-port topology
        run: |
          node -e "require('./graphscii-demo/draw-v6.js'); GraphSCIIDrawV6.selfTest(); console.log('GraphSCII v6 font-port topology self-test passed.')"

      - name: Verify pixel-slot and corner invariants are explicit
        shell: bash
        run: |
          grep -q 'Math.floor(localY / SLOT_H)' graphscii-demo/draw-v6.js
          grep -q 'Math.floor(localX / SLOT_W)' graphscii-demo/draw-v6.js
          grep -q 'Corner ports were incorrectly collapsed' graphscii-demo/draw-v6.js
          grep -q 'Exact-corner bridge glyph was omitted' graphscii-demo/draw-v6.js
          if grep -q 'return `K:' graphscii-demo/draw-v6.js; then
            echo "Perpendicular corner ports must never be collapsed into a synthetic K node"
            exit 1
          fi

      - name: Verify exact crossover vocabulary and layered fallback
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const index = JSON.parse(fs.readFileSync('artifacts/manifest/vocabulary-v1/indexes/by-bitmap.json', 'utf8'));
          if (index.index !== 'by-bitmap' || index.entryCount !== 6397) throw new Error('Unexpected by-bitmap vocabulary index');
          const horizontal = `ff${'00'.repeat(15)}`;
          const vertical = '01'.repeat(16);
          const rows = [];
          for (let y = 0; y < 16; y += 1) {
            rows.push((parseInt(horizontal.slice(y*2, y*2+2),16) | parseInt(vertical.slice(y*2, y*2+2),16)).toString(16).padStart(2,'0'));
          }
          const cross = rows.join('');
          if (index.entries[cross] !== 5796) throw new Error(`L0>R0 + T0>B0 must resolve to glyphId 5796/U+F6A4; got ${index.entries[cross]}`);
          const uploadedCross = '02020404080890502020504884840201';
          if (index.entries[uploadedCross] != null) throw new Error('Uploaded arbitrary crossing unexpectedly became a published single glyph');
          console.log('Published connector + arbitrary layered crossover regressions passed.');
          NODE
          grep -q 'CONNECTOR_OWNER_MIN = 5796' graphscii-demo/crossover-compositor-v1.js
          grep -q 'CONNECTOR_OWNER_MAX = 6396' graphscii-demo/crossover-compositor-v1.js
          grep -q "mode: 'layered'" graphscii-demo/crossover-compositor-v1.js
          grep -q 'for (const codepoint of resolution.codepoints)' graphscii-demo/crossover-compositor-v1.js
          grep -q '02020404080890502020504884840201' graphscii-demo/crossover-compositor-v1.js
          grep -q 'Object.entries(G.STRAIGHT_CODEPOINT_BY_PAIR)' graphscii-demo/crossover-compositor-v1.js
          grep -q 'state.bitmapIndex\[bitmapKey\]' graphscii-demo/crossover-compositor-v1.js

      - name: Verify one authoritative geometry state
        shell: bash
        run: |
          grep -q 'const D = globalThis.GraphSCIIDebug' graphscii-demo/crossover-compositor-v1.js
          grep -q 'for (const stroke of D.state.strokes)' graphscii-demo/crossover-compositor-v1.js
          grep -q 'for (const segment of stroke.finalSegments)' graphscii-demo/crossover-compositor-v1.js
          grep -q 'requestAnimationFrame(composite)' graphscii-demo/crossover-compositor-v1.js
          if grep -q 'G.compileRawPath' graphscii-demo/crossover-compositor-v1.js; then
            echo "Crossover compositor must never compile a second geometry path"
            exit 1
          fi
          if grep -q 'bezierClicks' graphscii-demo/crossover-compositor-v1.js; then
            echo "Crossover compositor must not own tool gesture state"
            exit 1
          fi

      - name: Verify font rendering contract
        shell: bash
        run: |
          grep -q "fillText" graphscii-demo/draw-v6.js
          grep -q "fillText" graphscii-demo/crossover-compositor-v1.js
          grep -q "document.fonts.load" graphscii-demo/draw-v6.js
          grep -q "GraphSCII" graphscii-demo/styles.css
          if grep -q "function rasterRows" graphscii-demo/draw-v6.js graphscii-demo/crossover-compositor-v1.js; then
            echo "Runtime must render the published font, not redraw glyph bitmaps itself"
            exit 1
          fi

      - name: Verify debug export contract
        shell: bash
        run: |
          grep -q 'id="debug-export"' graphscii-demo/index.html
          grep -q 'debug-export-v2.js' graphscii-demo/index.html
          grep -q 'rawPointerSamples' graphscii-demo/debug-export-v2.js
          grep -q 'rawBoundaryCrossings' graphscii-demo/debug-export-v2.js
          grep -q 'finalSegments' graphscii-demo/debug-export-v2.js
          grep -q 'glyphText' graphscii-demo/debug-export-v2.js
          grep -q 'multiPassCells' graphscii-demo/debug-export-v2.js
          grep -q 'brokenJoinCount' graphscii-demo/debug-export-v2.js
          grep -q '16 equal bitmap-row slots' graphscii-demo/debug-export-v2.js

      - name: Reject CSP-hostile browser execution
        shell: bash
        run: |
          if grep -En "eval[[:space:]]*\\(|new[[:space:]]+Function|import[[:space:]]*\\(" graphscii-demo/draw-v6.js graphscii-demo/debug-export-v2.js graphscii-demo/crossover-compositor-v1.js; then
            echo "CSP-hostile JavaScript construct found"
            exit 1
          fi
          if grep -Eq "draw-v5\\.js|debug-export-v1\\.js|draw-core-v3\\.js|draw-ui-v4\\.js|app\\.mjs|src=\"\\./app\\.js\"" graphscii-demo/index.html; then
            echo "Obsolete browser entrypoint referenced"
            exit 1
          fi
          grep -q 'draw-v6.js' graphscii-demo/index.html
          grep -q 'debug-export-v2.js' graphscii-demo/index.html
          grep -q 'crossover-compositor-v1.js' graphscii-demo/index.html

      - name: Check local server syntax
        run: python -m py_compile graphscii-demo/serve.py

      - name: Verify strict server headers and runtime MIME
        shell: bash
        run: |
          python graphscii-demo/serve.py 8765 >/tmp/graphscii-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl -fsSI http://127.0.0.1:8765/graphscii-demo/draw-v6.js > /tmp/runtime-headers
          grep -qi '^Content-Type: text/javascript' /tmp/runtime-headers
          grep -qi '^Cache-Control: .*no-store' /tmp/runtime-headers
          grep -qi "^Content-Security-Policy: .*script-src 'self'" /tmp/runtime-headers
          if grep -qi 'unsafe-eval' /tmp/runtime-headers; then
            echo "unsafe-eval must never be enabled"
            exit 1
          fi
          curl -fsSI http://127.0.0.1:8765/graphscii-demo/debug-export-v2.js | grep -qi '^Content-Type: text/javascript'
          curl -fsSI http://127.0.0.1:8765/graphscii-demo/crossover-compositor-v1.js | grep -qi '^Content-Type: text/javascript'
          curl -fsSI http://127.0.0.1:8765/artifacts/manifest/vocabulary-v1/indexes/by-bitmap.json | grep -qi '^Content-Type: application/json'
          curl -fsS http://127.0.0.1:8765/graphscii-demo/ | grep -q 'draw-v6.js'
          curl -fsS http://127.0.0.1:8765/graphscii-demo/ | grep -q 'debug-export-v2.js'
          curl -fsS http://127.0.0.1:8765/graphscii-demo/ | grep -q 'crossover-compositor-v1.js'
