name: Verify Milestone 5A.2 generic lattice

on:
  push:
    branches:
      - milestone-5a2-generic-lattice
  pull_request:
    branches:
      - milestone-5-junction-coverage-plan

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-5a2-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-5a2-generic-lattice
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geometric-glyph-lab
        run: npm install

      - name: Typecheck source
        working-directory: geometric-glyph-lab
        run: npm run check

      - name: Generate deterministic project artifacts
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify complete project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Commit deterministic Milestone 5A.2 outputs on push runs
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            artifacts/research/junctions/geometry-stats.json \
            artifacts/research/junctions/geometry-model-sweep.json \
            artifacts/research/junctions/generic-lattice-600.json \
            artifacts/research/junctions/geometry-report.md \
            spec/junction-geometry-research-v0.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate Milestone 5A.2 generic lattice artifacts"
          fi

      - name: Advance Milestone 5 roadmap on push runs
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          detailed = Path("docs/milestone-5-junction-coverage-plan.md")
          text = detailed.read_text()
          text = text.replace(
              "Status: **PLANNED — 5A.1 NEXT**",
              "Status: **IN PROGRESS — 5A.1 + 5A.2 COMPLETE; 5A.3 NEXT**",
              1,
          )
          old_execution = '''5A.1  straight-composition demand map + coverage taxonomy       NEXT
          5A.2  deterministic junction raster/hub model sweep
          5A.3  exhaustive candidate generation + global exact dedup
          5A.4  demand/breadth/Pareto budget optimization, K=0..604
          5A.5  research atlases + measured recommendation'''
          new_execution = '''5A.1  straight-composition demand map + coverage taxonomy       COMPLETE
          5A.2  deterministic raster + generic 600-lattice sweep           COMPLETE
          5A.3  exhaustive candidate generation + global exact dedup       NEXT
          5A.4  demand/breadth/Pareto budget optimization, K=0..604
          5A.5  research atlases + measured recommendation'''
          if old_execution in text:
              text = text.replace(old_execution, new_execution, 1)
          elif new_execution not in text:
              raise SystemExit("Could not advance detailed Milestone 5 execution block")

          start = text.find("## 13. 5A.1 definition of done")
          end = text.find("## 14. Guiding rule")
          if start != -1 and end != -1 and start < end:
              replacement = '''## 13. Current execution state

### 5A.1 — COMPLETE

The straight-composition demand map measured 22,428 of 22,528 theoretical one-port-per-edge junction semantics (99.556108%) with 928,242 weighted demand events. All 6,144 three-port semantics occur; the 100 zero-demand blind spots are four-port LRTB breadth-protection cases.

### 5A.2 — COMPLETE

The raster sweep now uses boundary-safe inward ingress from every declared port. All 22,428 demanded semantics pass every validity gate under all four tested geometry models.

The 600-entry generic theory is now a first-class optimization input. Four frozen baselines were measured:

```text
strategy                      exact demand   avg breadth Δ   p95 breadth Δ
pure demand-top                 21.358223%       0.560884        1.000000
even topology-balanced          15.088953%       0.204765        0.400000
even space-proportional          7.981755%       0.163349        0.285714
hybrid even + demand            17.255414%       0.174906        0.285714
```

The pure frequency list leaves severe four-port coverage holes. The even lattice dramatically improves geometric breadth, and the hybrid retains much of that breadth while recovering substantial measured demand. The next optimizer must therefore carry both empirical demand and generic evenly spaced coverage rather than selecting by frequency alone.

Completion note: [`docs/milestone-5a2-generic-lattice.md`](docs/milestone-5a2-generic-lattice.md)

### 5A.3 — NEXT

Exhaustively materialize boundary-safe junction candidates from the measured semantic universe and geometry models, globally exact-deduplicate them against `graphscii-graphics-v0` and one another, attach both demand and generic-lattice coverage sets to every visual owner, and produce the owner population that 5A.4 will optimize across budgets 0..604.

'''
              text = text[:start] + replacement + text[end:]
          detailed.write_text(text)

          plan = Path("PLAN.md")
          text = plan.read_text()
          old_block = '''## 11. Later milestones

          ```text
          5   junctions / reserve-budget strategy
          6   curated curve/arc extension if justified
          7   terminals / specials
          8   vocabulary optimization
          9   font compiler
          10  drawing API / solver
          11  interactive editor
          12  GraphSCII v1 freeze / release
          ```

          The 604-slot reserve is intentionally protected until later families are measured.'''
          new_block = '''## 11. Milestone 5 — junction coverage and reserve-budget strategy — IN PROGRESS

          Detailed plan: [`docs/milestone-5-junction-coverage-plan.md`](docs/milestone-5-junction-coverage-plan.md)

          ```text
          5A.1  straight-composition demand map + taxonomy             COMPLETE
          5A.2  boundary-safe geometry + generic 600-lattice sweep     COMPLETE
          5A.3  exhaustive candidate generation + exact dedup          NEXT
          5A.4  demand/breadth/Pareto optimization, K=0..604
          5A.5  research atlases + measured recommendation
          5B    junction budget/allocation decision
          5C    junction registry + provisional allocation
          5D    canonical junction artifacts + master-atlas integration
          5E    publication update + reserve accounting
          ```

          Measured 5A.1 demand covers **22,428 / 22,528** theoretical junction semantics with **928,242** weighted demand events. Measured 5A.2 shows that a pure top-600 frequency list has poor geometric breadth, while evenly spaced dyadic port lattices and a hybrid lattice+demand basis cover the connection space far more uniformly. The generic lattice is therefore a permanent optimization input, not a fallback experiment.

          The 5A.2 working experiment uses 600 semantic connector slots while allocating **zero** codepoints. The full **604-slot U+F6A4..U+F8FF reserve remains protected**.

          Later milestones remain:

          ```text
          6   curated curve/arc extension if justified
          7   terminals / specials
          8   vocabulary optimization
          9   font compiler
          10  drawing API / solver
          11  interactive editor
          12  GraphSCII v1 freeze / release
          ```'''
          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          elif new_block not in text:
              raise SystemExit("Could not advance root Milestone 5 roadmap block")

          old_commands = '''npm run generate:graphics-publication
          npm run verify:graphics-publication
          npm run check'''
          new_commands = '''npm run generate:graphics-publication
          npm run verify:graphics-publication
          npm run generate:junction-demand
          npm run verify:junction-demand
          npm run generate:junction-blind-spots
          npm run verify:junction-blind-spots
          npm run generate:junction-geometry
          npm run verify:junction-geometry
          npm run check'''
          if old_commands in text:
              text = text.replace(old_commands, new_commands, 1)
          elif new_commands not in text:
              raise SystemExit("Could not advance root command list")

          text = text.replace(
              "Milestone 5 junction research is next.",
              "Milestone 5A.1 and 5A.2 are complete; exhaustive boundary-safe junction candidate generation and global exact dedup in Milestone 5A.3 is next.",
              1,
          )
          plan.write_text(text)
          PY

          git add -- PLAN.md docs/milestone-5-junction-coverage-plan.md
          if ! git diff --cached --quiet; then
            git commit -m "Advance roadmap through Milestone 5A.2"
          fi

      - name: Push generated and roadmap commits
        if: github.event_name == 'push'
        shell: bash
        run: git push origin HEAD:milestone-5a2-generic-lattice
