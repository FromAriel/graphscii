name: Verify GraphSCII Draw demo

on:
  pull_request:
    paths:
      - "graphscii-demo/**"
      - "artifacts/fonts/**"
      - "artifacts/manifest/vocabulary-v1/**"
      - ".github/workflows/verify-graphscii-demo.yml"
  push:
    branches:
      - main
    paths:
      - "graphscii-demo/**"
      - "artifacts/fonts/**"
      - "artifacts/manifest/vocabulary-v1/**"
      - ".github/workflows/verify-graphscii-demo.yml"

permissions:
  contents: read

jobs:
  verify-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: graphscii-demo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Python launcher
        run: python -m py_compile launch.py

      - name: Install demo dependencies
        run: npm install --no-audit --no-fund

      - name: Verify GraphSCII Draw demo
        run: npm run verify
