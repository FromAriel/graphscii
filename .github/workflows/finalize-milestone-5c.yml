name: Finalize Milestone 5C roadmap

on:
  push:
    branches:
      - milestone-5c-connector-allocation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-5c-connector-allocation
          fetch-depth: 0

      - name: Advance living plans
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          plan = Path('PLAN.md')
          text = plan.read_text()
          start = text.index('## 11. Milestone 5 — junction coverage and reserve-budget strategy')
          end = text.index('Later milestones remain:', start)
          replacement = '''## 11. Milestone 5 — generic connector vocabulary — IN PROGRESS

Detailed research plan: [`docs/milestone-5-junction-coverage-plan.md`](docs/milestone-5-junction-coverage-plan.md)

```text
5A.1  straight-composition demand map + taxonomy              COMPLETE
5A.2  boundary-safe geometry + generic lattice research       COMPLETE
5A.3  exhaustive candidate/dedup research                     COMPLETE / SUPERSEDED
5B.1  640-semantic orthogonal generic basis                   COMPLETE
5B.2  deterministic diagonal generic basis                    COMPLETE
5C    connector registry + provisional allocation             COMPLETE
5D    canonical connector artifacts + atlas integration       COMPLETE (WITH 5C)
5E    graphics-v1 publication + final reserve accounting      NEXT
```

Final selected connector basis:

```text
orthogonal semantics                    640
diagonal semantics                       60
connector semantics total               700
novel orthogonal owners                  544
novel diagonal owners                     57
novel connector owners total             601
```

Provisional v1 address map:

```text
U+E000..U+F6A3    5,796   unchanged graphics-v0 owners
U+F6A4..U+F8FC      601   generic connector owners
U+F8FD..U+F8FF        3   final reserve
```

Completion notes:

- [`docs/milestone-5b1-orthogonal-generic-connectors.md`](docs/milestone-5b1-orthogonal-generic-connectors.md)
- [`docs/milestone-5b2-diagonal-generic-connectors.md`](docs/milestone-5b2-diagonal-generic-connectors.md)
- [`docs/milestone-5c-connector-allocation.md`](docs/milestone-5c-connector-allocation.md)

The generic connector vocabulary is deliberately rule-generated rather than frequency-picked: all orthogonal crossing/three-leg positions, plus the fixed axis-squash diagonal X family and its selected symmetric missing-leg variants. Exact bitmap dedup determines storage cost.

'''
          plan.write_text(text[:start] + replacement + text[end:])

          detail = Path('docs/milestone-5-junction-coverage-plan.md')
          d = detail.read_text()
          d = d.replace(
              'Status: **IN PROGRESS — 5A.1 + 5A.2 COMPLETE; 5A.3 NEXT**',
              'Status: **IN PROGRESS — GENERIC CONNECTOR BASIS FROZEN; 5C/5D COMPLETE; 5E NEXT**'
          )
          old = '''5A.1  straight-composition demand map + coverage taxonomy       COMPLETE
5A.2  deterministic raster + generic 600-lattice sweep           COMPLETE
5A.3  exhaustive candidate generation + global exact dedup       NEXT
5A.4  demand/breadth/Pareto budget optimization, K=0..604
5A.5  research atlases + measured recommendation

5B    selected junction budget/allocation decision
5C    junction registry + provisional codepoint allocation
5D    canonical junction artifacts + master atlas integration
5E    graphics publication update + reserve accounting'''
          new = '''5A.1  straight-composition demand map + coverage taxonomy       COMPLETE
5A.2  deterministic raster + generic lattice sweep              COMPLETE
5A.3  exhaustive candidate generation + global exact dedup      COMPLETE / SUPERSEDED
5B.1  orthogonal generic connector basis                        COMPLETE
5B.2  deterministic diagonal generic connector basis            COMPLETE
5C    connector registry + provisional codepoint allocation     COMPLETE
5D    canonical connector artifacts + atlas integration         COMPLETE (WITH 5C)
5E    graphics-v1 publication + final reserve accounting        NEXT'''
          d = d.replace(old, new)
          d += '''\n\n## 15. Curated-basis decision and allocation result\n\nThe exhaustive search was intentionally superseded by a smaller rule-generated basis that is easier to reason about and select programmatically.\n\n```text\northogonal semantic connectors        640\ndiagonal semantic connectors            60\nsemantic connector language             700\nnovel orthogonal owners                 544\nnovel diagonal owners                    57\nnovel connector owners                  601\nfinal encoded v1 owners               6,397\nfinal reserve slots                       3\n```\n\nThe provisional connector range is `U+F6A4..U+F8FC`; `U+F8FD..U+F8FF` remains reserved. Milestone 5E is the formal publication/update gate.\n'''
          detail.write_text(d)
          PY

      - name: Commit roadmap finalization and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-milestone-5c.yml
          git add -- PLAN.md docs/milestone-5-junction-coverage-plan.md
          git commit -m "Advance roadmap through Milestone 5C"
          git push origin HEAD:milestone-5c-connector-allocation
