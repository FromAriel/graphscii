name: Verify Milestone 5B.2 diagonal connectors

on:
  push:
    branches:
      - milestone-5-junction-coverage-plan

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-5b2
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Milestone 5 branch
        uses: actions/checkout@v4
        with:
          ref: milestone-5-junction-coverage-plan
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geometric-glyph-lab
        run: npm install

      - name: Typecheck source
        working-directory: geometric-glyph-lab
        run: npm run check

      - name: Generate deterministic project artifacts
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify complete project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Print diagonal connector measurements
        run: cat artifacts/research/junctions/diagonal-stats.json

      - name: Commit deterministic Milestone 5B.2 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            artifacts/research/junctions/diagonal-connectors.json \
            artifacts/research/junctions/diagonal-owners.json \
            artifacts/research/junctions/diagonal-stats.json \
            artifacts/research/junctions/diagonal-report.md \
            spec/diagonal-junction-basis-v0.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate Milestone 5B.2 diagonal connector artifacts"
            git push origin HEAD:milestone-5-junction-coverage-plan
          else
            echo "Milestone 5B.2 generated outputs already match."
          fi
