name: Verify Milestone 4D.1 canonical vocabulary

on:
  push:
    branches:
      - milestone-4d-publication-plan

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-4d1
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-4d-publication-plan
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geometric-glyph-lab
        run: npm install

      - name: Typecheck source
        working-directory: geometric-glyph-lab
        run: npm run check

      - name: Refresh prebuilt core modules
        working-directory: geometric-glyph-lab
        shell: bash
        run: |
          rm -rf .prebuilt
          npx tsc --noEmit false --outDir .prebuilt --rootDir src
          cp .prebuilt/core/*.js dist/core/
          rm -rf .prebuilt

      - name: Generate deterministic artifacts
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify complete project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Mark 4D.1 complete in persistent roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          plan = Path("PLAN.md")
          text = plan.read_text()
          replacements = [
              (
                  "## 10. Milestone 4D — published graphics vocabulary v0 — NEXT",
                  "## 10. Milestone 4D — published graphics vocabulary v0 — IN PROGRESS",
              ),
              (
                  "4D.1  canonical allocation registry                 NEXT\n4D.2  5,796 canonical ASCII/PNG artifacts",
                  "4D.1  canonical allocation registry                 COMPLETE\n4D.2  5,796 canonical ASCII/PNG artifacts             NEXT",
              ),
              (
                  "### 4D.1 — canonical allocation registry\n\nFreeze one global encoded registry spanning the 5,796 addressable graphics.",
                  "### 4D.1 — canonical allocation registry — COMPLETE\n\nCompletion note: [`docs/milestone-4d1-canonical-allocation-registry.md`](docs/milestone-4d1-canonical-allocation-registry.md)\n\nOne global encoded registry now spans the 5,796 addressable graphics.",
              ),
              (
                  "npm run generate:palette\nnpm run verify:palette\nnpm run check",
                  "npm run generate:palette\nnpm run verify:palette\nnpm run generate:vocabulary\nnpm run verify:vocabulary\nnpm run check",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"PLAN.md expected text missing: {old!r}")
              text = text.replace(old, new, 1)
          plan.write_text(text)

          detail = Path("docs/milestone-4d-publication-plan.md")
          text = detail.read_text()
          replacements = [
              (
                  "Status: **PLANNED — NEXT IMPLEMENTATION MILESTONE**",
                  "Status: **IN PROGRESS — 4D.1 COMPLETE; 4D.2 NEXT**",
              ),
              (
                  "## 2. Milestone 4D.1 — canonical allocation registry\n\n4D.1 is the immediate next implementation slice.",
                  "## 2. Milestone 4D.1 — canonical allocation registry — COMPLETE\n\nCompletion note: [`milestone-4d1-canonical-allocation-registry.md`](milestone-4d1-canonical-allocation-registry.md)",
              ),
              (
                  "## 3. Milestone 4D.2 — canonical per-glyph artifacts",
                  "## 3. Milestone 4D.2 — canonical per-glyph artifacts — NEXT",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"4D plan expected text missing: {old!r}")
              text = text.replace(old, new, 1)
          detail.write_text(text)
          PY

      - name: Commit deterministic Milestone 4D.1 outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            PLAN.md \
            docs/milestone-4d-publication-plan.md \
            geometric-glyph-lab/dist/core/index.js \
            geometric-glyph-lab/dist/core/vocabulary.js \
            artifacts/manifest/vocabulary
          if git diff --cached --quiet; then
            echo "Milestone 4D.1 outputs and roadmap already match deterministic generation."
            exit 0
          fi
          git commit -m "Complete Milestone 4D.1 canonical allocation registry"
          git push origin HEAD:milestone-4d-publication-plan
