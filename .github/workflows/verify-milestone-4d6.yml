name: Verify Milestone 4D.6 graphics publication

on:
  push:
    branches:
      - milestone-4d-publication-plan

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-4d6
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-4d-publication-plan
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geometric-glyph-lab
        run: npm install

      - name: Typecheck source
        working-directory: geometric-glyph-lab
        run: npm run check

      - name: Generate deterministic project artifacts
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify complete project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Record generated 4D content digest set
        shell: bash
        run: |
          find artifacts/manifest/vocabulary artifacts/vocabulary -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/4d-before.sha256
          sha256sum artifacts/publications/graphscii-graphics-v0.json artifacts/publications/graphscii-graphics-v0.md >> /tmp/4d-before.sha256

      - name: Delete generated 4D outputs
        shell: bash
        run: |
          rm -rf artifacts/manifest/vocabulary
          rm -rf artifacts/vocabulary/glyphs
          rm -rf artifacts/vocabulary/atlases
          rm -rf artifacts/vocabulary/renderer-only
          rm -f artifacts/publications/graphscii-graphics-v0.json artifacts/publications/graphscii-graphics-v0.md

      - name: Fresh-regenerate all project artifacts
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify fresh-regenerated project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Prove byte-stable fresh generation
        shell: bash
        run: |
          find artifacts/manifest/vocabulary artifacts/vocabulary -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/4d-after.sha256
          sha256sum artifacts/publications/graphscii-graphics-v0.json artifacts/publications/graphscii-graphics-v0.md >> /tmp/4d-after.sha256
          diff -u /tmp/4d-before.sha256 /tmp/4d-after.sha256

      - name: Require no drift in pre-existing 4D outputs
        shell: bash
        run: git diff --exit-code -- artifacts/manifest/vocabulary artifacts/vocabulary

      - name: Commit deterministic publication snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- artifacts/publications/graphscii-graphics-v0.json artifacts/publications/graphscii-graphics-v0.md
          if git diff --cached --quiet; then
            echo "Milestone 4D.6 publication already matches deterministic generation."
            exit 0
          fi
          git commit -m "Publish graphscii-graphics-v0 snapshot"
          git push origin HEAD:milestone-4d-publication-plan
