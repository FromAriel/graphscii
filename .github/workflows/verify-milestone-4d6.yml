name: Verify Milestone 4D.6 graphics publication

on:
  push:
    branches:
      - milestone-4d-publication-plan

permissions:
  contents: write

concurrency:
  group: graphscii-milestone-4d6
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-4d-publication-plan
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: geometric-glyph-lab
        run: npm install

      - name: Typecheck source
        working-directory: geometric-glyph-lab
        run: npm run check

      - name: Generate deterministic project artifacts
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify complete project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Record generated 4D content digest set
        shell: bash
        run: |
          find artifacts/manifest/vocabulary artifacts/vocabulary -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/4d-before.sha256
          sha256sum artifacts/publications/graphscii-graphics-v0.json artifacts/publications/graphscii-graphics-v0.md >> /tmp/4d-before.sha256

      - name: Delete generated 4D outputs
        shell: bash
        run: |
          rm -rf artifacts/manifest/vocabulary
          rm -rf artifacts/vocabulary/glyphs
          rm -rf artifacts/vocabulary/atlases
          rm -rf artifacts/vocabulary/renderer-only
          rm -f artifacts/publications/graphscii-graphics-v0.json artifacts/publications/graphscii-graphics-v0.md

      - name: Fresh-regenerate all project artifacts
        working-directory: geometric-glyph-lab
        run: npm run generate

      - name: Verify fresh-regenerated project
        working-directory: geometric-glyph-lab
        run: npm run verify

      - name: Prove byte-stable fresh generation
        shell: bash
        run: |
          find artifacts/manifest/vocabulary artifacts/vocabulary -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/4d-after.sha256
          sha256sum artifacts/publications/graphscii-graphics-v0.json artifacts/publications/graphscii-graphics-v0.md >> /tmp/4d-after.sha256
          diff -u /tmp/4d-before.sha256 /tmp/4d-after.sha256

      - name: Require no drift in pre-existing 4D outputs
        shell: bash
        run: git diff --exit-code -- artifacts/manifest/vocabulary artifacts/vocabulary

      - name: Commit deterministic publication snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- artifacts/publications/graphscii-graphics-v0.json artifacts/publications/graphscii-graphics-v0.md
          if git diff --cached --quiet; then
            echo "Milestone 4D.6 publication already matches deterministic generation."
          else
            git commit -m "Publish graphscii-graphics-v0 snapshot"
            git push origin HEAD:milestone-4d-publication-plan
            exit 0
          fi

      - name: Write Milestone 4D.6 completion record and advance roadmap
        shell: bash
        run: |
          cat > docs/milestone-4d6-graphics-publication.md <<'EOF'
          # Milestone 4D.6 — GraphSCII Graphics Vocabulary v0 Publication

          Status: **COMPLETE — FRESH-BUILD VERIFIED, BYTE-STABLE, AND PUBLISHED ON THE FEATURE BRANCH**

          Milestone 4D.6 freezes the complete Milestone 4D graphics vocabulary as the deterministic `graphscii-graphics-v0` publication snapshot.

          No additional graphics were introduced in this slice. The publication records and verifies the vocabulary produced by Milestones 4D.1 through 4D.5.

          ## Publication outputs

          ```text
          artifacts/publications/
          ├── straight-v0.json
          ├── graphscii-graphics-v0.json
          └── graphscii-graphics-v0.md
          ```

          The publication generator and verifier are permanent pipeline components:

          ```powershell
          npm run generate:graphics-publication
          npm run verify:graphics-publication
          ```

          Both are included in the aggregate `npm run generate` and `npm run verify` commands.

          ## Frozen publication population

          ```text
          encoded PUA graphics                         5,796
          printable ASCII characters                     95
          minimum eventual physical glyph population   5,891
          semantic aliases                            10,816

          renderer-only semantic aliases               3,392
            exact encoded reuses                         414
            derived aliases                            2,978
            globally unique derived bitmaps            2,555

          protected BMP PUA reserve                      604
          ```

          Canonical encoded classes remain:

          ```text
          straight                                      746
          solid 100%                                  1,259
          medium 75%                                 1,269
          light 25%                                  1,315
          half 50%                                   1,207
                                                     -----
          total                                      5,796
          ```

          ## Frozen address space

          ```text
          U+E000..U+E2E9      746   published straight visuals
          U+E2EA..U+E7D4    1,259   solid 100%
          U+E7D5..U+ECC9    1,269   medium 75%
          U+ECCA..U+F1EC    1,315   light 25%
          U+F1ED..U+F6A3    1,207   retained half 50%
          U+F6A4..U+F8FF      604   unallocated protected reserve
          ```

          The original 746 straight codepoints remain unchanged.

          ## Publication integrity record

          `graphscii-graphics-v0.json` records SHA-256 digests for:

          ```text
          canonical vocabulary registry
          vocabulary statistics
          renderer-only resolution index
          categorized atlas statistics
          master text atlas
          master page atlas
          master layout map
          ```

          The source baseline is the verified Milestone 4D.5 commit `415e8a0b31b987f72ffd3677a8537acff3c245b2`. Keeping the baseline fixed makes the publication output reproducible rather than allowing the manifest to rewrite itself with every later repository commit.

          ## Fresh-build gate

          The temporary Milestone 4D.6 verification workflow performed two complete generation passes.

          First it ran:

          ```text
          npm run check
          npm run generate
          npm run verify
          ```

          It then recorded SHA-256 hashes for the entire generated Milestone 4D vocabulary tree and the two publication files, deleted the generated 4D registry, glyph, atlas, renderer-only, and `graphscii-graphics-v0` outputs, and ran a second complete generation and verification pass.

          The before/after digest sets were required to be byte-identical. The workflow also required no drift in the previously committed Milestone 4D outputs before publishing the snapshot.

          The publication snapshot was committed only after those gates passed.

          ## Result

          Milestone 4D is complete.

          GraphSCII now has a deterministic, addressable, publication-facing graphics vocabulary with:

          - one global 5,796-owner encoded registry;
          - exact 8×16 ASCII and PNG artifacts for every encoded owner;
          - categorized and combined visual/text atlases;
          - the master categorized text atlas and codepoint page atlas;
          - explicit renderer-only resolution for dense, sparse, and demoted-half semantics;
          - a protected 604-slot BMP PUA reserve; and
          - the reproducible `graphscii-graphics-v0` publication manifest.

          The next milestone is **Milestone 5 — junction vocabulary and reserve-budget strategy**. Any future use of the 604-slot reserve must be measured and explicitly promoted rather than silently allocated.
          EOF

          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"Could not update {label}")

          plan = Path("PLAN.md")
          text = plan.read_text()
          replacements = [
              (
                  "## 10. Milestone 4D — published graphics vocabulary v0 — IN PROGRESS",
                  "## 10. Milestone 4D — published graphics vocabulary v0 — COMPLETE",
                  "PLAN Milestone 4D heading",
              ),
              (
                  "4D.6  graphscii-graphics-v0 publication snapshot              NEXT",
                  "4D.6  graphscii-graphics-v0 publication snapshot              COMPLETE",
                  "PLAN 4D.6 execution status",
              ),
              (
                  "### 4D.6 — publication — NEXT",
                  "### 4D.6 — publication — COMPLETE\n\nCompletion note: [`docs/milestone-4d6-graphics-publication.md`](docs/milestone-4d6-graphics-publication.md)",
                  "PLAN 4D.6 heading",
              ),
              (
                  "npm run generate:renderer-only-resolution\nnpm run verify:renderer-only-resolution\nnpm run check",
                  "npm run generate:renderer-only-resolution\nnpm run verify:renderer-only-resolution\nnpm run generate:graphics-publication\nnpm run verify:graphics-publication\nnpm run check",
                  "PLAN publication commands",
              ),
              (
                  "Milestone 4D.6 publication is next.",
                  "Milestone 4D is complete. The deterministic `graphscii-graphics-v0` publication now freezes the 5,796-owner encoded vocabulary, renderer-only resolution layer, master atlases, SHA-256 integrity digests, and the untouched 604-slot reserve after a byte-stable delete-and-regenerate verification gate. Milestone 5 junction research is next.",
                  "PLAN current-state paragraph",
              ),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)
          plan.write_text(text)

          detailed = Path("docs/milestone-4d-publication-plan.md")
          text = detailed.read_text()
          replacements = [
              (
                  "Status: **IN PROGRESS — 4D.1 THROUGH 4D.5 COMPLETE; 4D.6 NEXT**",
                  "Status: **COMPLETE — 4D.1 THROUGH 4D.6 FRESH-BUILD VERIFIED**",
                  "detailed Milestone 4D status",
              ),
              (
                  "## 7. Milestone 4D.6 — publication snapshot — NEXT",
                  "## 7. Milestone 4D.6 — publication snapshot — COMPLETE\n\nCompletion note: [`milestone-4d6-graphics-publication.md`](milestone-4d6-graphics-publication.md)",
                  "detailed 4D.6 heading",
              ),
              (
                  "4D.6  graphscii-graphics-v0 publication snapshot      NEXT",
                  "4D.6  graphscii-graphics-v0 publication snapshot      COMPLETE",
                  "detailed implementation order",
              ),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)
          detailed.write_text(text)
          PY

      - name: Commit Milestone 4D completion record
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- PLAN.md docs/milestone-4d-publication-plan.md docs/milestone-4d6-graphics-publication.md
          if git diff --cached --quiet; then
            echo "Milestone 4D roadmap already finalized."
            exit 0
          fi
          git commit -m "Complete Milestone 4D graphics vocabulary publication"
          git push origin HEAD:milestone-4d-publication-plan
